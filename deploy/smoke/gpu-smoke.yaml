# Проверка, что под в кластере видит видеокарту.
#   kubectl apply -f deploy/smoke/gpu-smoke.yaml
#   kubectl logs -f pod/gpu-smoke      # в логах — таблица nvidia-smi с вашей картой
#   kubectl delete -f deploy/smoke/gpu-smoke.yaml
#
# Образ обычный: nvidia-smi и библиотеки драйвера прокидывает в контейнер рантайм nvidia,
# это и проверяем. Пример NVIDIA из nvcr.io не используем: из России реестр отвечает 403.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
  labels:
    app.kubernetes.io/part-of: llm-bench
spec:
  restartPolicy: Never
  # k3s регистрирует рантайм NVIDIA как RuntimeClass, но не делает его рантаймом по умолчанию.
  runtimeClassName: nvidia
  nodeSelector:
    gpu: "true"
  containers:
    - name: smoke
      image: ubuntu:24.04
      command: ["nvidia-smi"]
      # Без device plugin карту выдаёт не планировщик, а сам рантайм — по этим переменным.
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
