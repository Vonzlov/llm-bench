# Корень uv workspace. Сам по себе корень — не пакет: он собирает приложения
# из apps/ (позже и общий пакет из packages/) в одно окружение для разработки.
[project]
name = "llm-bench"
version = "0.1.0"
description = "Сервис выбора LLM под задачу: качество, скорость и цена моделей на одной машине с GPU"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fake-llm"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv.sources]
fake-llm = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# RUF001–RUF003 ругаются на кириллицу, похожую на латиницу. Комментарии и тексты
# у нас на русском, поэтому эти проверки только мешают.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["fake_llm", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/fake-llm/src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
