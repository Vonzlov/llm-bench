[project]
name = "bench-core"
version = "0.1.0"
description = "Ядро бенчмарка: клиенты к моделям, замеры времени, метрики"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
bench-probe = "bench_core.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
