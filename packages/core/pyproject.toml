[project]
name = "bench-core"
version = "0.1.0"
description = "Ядро бенчмарка: клиенты к моделям, замеры времени, метрики"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
bench-probe = "bench_core.probe:main"
bench-load = "bench_core.load_cli:main"
bench-datasets = "bench_core.datasets_cli:main"
bench-quality = "bench_core.quality_cli:main"
bench-compare = "bench_core.compare_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
